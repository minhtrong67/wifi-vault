<!doctype html>
<!-- Nguồn của public/og-image.png (1200×630). Xuất lại bằng: node scripts/build-og-image.mjs -->
<html lang="en"><head><meta charset="utf-8" />
<style>
  @font-face{font-family:Roboto;font-weight:400;src:url(../node_modules/@fontsource/roboto/files/roboto-latin-400-normal.woff2)}
  @font-face{font-family:Roboto;font-weight:500;src:url(../node_modules/@fontsource/roboto/files/roboto-latin-500-normal.woff2)}
  @font-face{font-family:Roboto;font-weight:700;src:url(../node_modules/@fontsource/roboto/files/roboto-latin-700-normal.woff2)}
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;font-family:Roboto,sans-serif;color:#191C20;overflow:hidden;position:relative;
    background:radial-gradient(900px 600px at 105% -10%,#D1E4FF 0,transparent 60%),radial-gradient(700px 500px at -5% 110%,#F2DAFF 0,transparent 60%),#F8F9FF}
  .left{position:absolute;left:84px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center}
  .logo{width:112px;height:112px;border-radius:28px;box-shadow:0 8px 24px rgba(25,73,117,.28)}
  h1{font-size:96px;font-weight:700;letter-spacing:-2px;line-height:1;margin-top:36px;color:#194975}
  p.tag{font-size:34px;line-height:1.35;margin-top:22px;color:#43474E;max-width:520px}
  .by{display:flex;gap:12px;margin-top:40px}
  .chip{font-size:22px;font-weight:500;padding:9px 20px;border-radius:999px}
  .c1{background:#D1E4FF;color:#194975}.c2{background:#F2DAFF;color:#523F5F}
  .stack{position:absolute;right:70px;top:90px;width:440px}
  .card{display:flex;align-items:center;gap:20px;background:#fff;border-radius:24px;padding:22px 26px;margin-bottom:20px;box-shadow:0 2px 6px rgba(0,0,0,.08),0 10px 28px rgba(54,97,142,.14)}
  .card:nth-child(1){transform:translateX(-36px)}.card:nth-child(3){transform:translateX(-18px)}
  .ic{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;flex:none}
  .ic svg{width:32px;height:32px}
  .n{font-size:28px;font-weight:500}.pw{font-size:26px;letter-spacing:5px;color:#73777F;margin-top:2px}
  .tg{margin-left:auto;font-size:18px;font-weight:500;padding:5px 12px;border-radius:10px}
</style></head><body>
<div class="left">
  <svg class="logo" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A7DB3"/><stop offset="1" stop-color="#274F7D"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#g)"/><g fill="none" stroke="#fff" stroke-width="3.8" stroke-linecap="round"><path d="M15.74 25.89A23 23 0 0 1 48.26 25.89"/><path d="M20.33 30.48A16.5 16.5 0 0 1 43.67 30.48"/><path d="M24.93 35.08A10 10 0 0 1 39.07 35.08"/></g><circle cx="32" cy="42.15" r="4.8" fill="#D1E4FF"/><circle cx="32" cy="41.55" r="1.7" fill="#274F7D"/><path d="M31.1 42.05h1.8l.5 2.9h-2.8z" fill="#274F7D"/></svg>
  <h1>Wifi Vault</h1>
  <p class="tag">Organize, search and manage your WiFi passwords in one clean place.</p>
  <div class="by"><span class="chip c1">minhtrong67</span><span class="chip c2">✦ Claude</span></div>
</div>
<div class="stack">
  <div class="card"><span class="ic" style="background:#CDEBD5"><svg viewBox="0 0 24 24" fill="none" stroke="#1F6B3B" stroke-width="2.2" stroke-linecap="round"><path d="M5 12.55a11 11 0 0 1 14 0M8.5 16.1a6 6 0 0 1 7 0M12 20h.01"/></svg></span><div><div class="n">Home_5G</div><div class="pw">••••••••••</div></div><span class="tg" style="background:#CDEBD5;color:#1F6B3B">Home</span></div>
  <div class="card"><span class="ic" style="background:#FFDDB8"><svg viewBox="0 0 24 24" fill="none" stroke="#8A4F00" stroke-width="2.2" stroke-linecap="round"><path d="M5 12.55a11 11 0 0 1 14 0M8.5 16.1a6 6 0 0 1 7 0M12 20h.01"/></svg></span><div><div class="n">Coffee House</div><div class="pw">•••••••••••</div></div><span class="tg" style="background:#FFDDB8;color:#8A4F00">Cafe</span></div>
  <div class="card"><span class="ic" style="background:#D1E4FF"><svg viewBox="0 0 24 24" fill="none" stroke="#194975" stroke-width="2.2" stroke-linecap="round"><path d="M5 12.55a11 11 0 0 1 14 0M8.5 16.1a6 6 0 0 1 7 0M12 20h.01"/></svg></span><div><div class="n">Office_Guest</div><div class="pw">•••••••••</div></div><span class="tg" style="background:#D1E4FF;color:#194975">Work</span></div>
</div>
</body></html>
